org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official

# libmpv for the Windows build. The build downloads libmpvUrl, checks that it is a 64-bit DLL, and records its SHA-256;
# the app and the installer accept only that file. libmpvMirrorUrl is an optional second copy, tried when the first fails.
# -PlibmpvSkip=true builds without libmpv (offline builds): nothing is downloaded, and the app never fetches libmpv.
libmpvUrl=https://drive.usercontent.google.com/download?id=1zF1TbPHoSBVTRzjPVX7ktmwWb6rAUVM4&export=download&confirm=t
libmpvMirrorUrl=
