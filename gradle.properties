org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official

# libmpv for the Windows build. The build downloads libmpvUrl, checks that it is a 64-bit DLL, and records its SHA-256;
# the app and the installer accept only that file. libmpvMirrorUrl is an optional second copy, tried when the first fails.
# -PlibmpvSkip=true builds without libmpv (offline builds): nothing is downloaded, and the app never fetches libmpv.
libmpvUrl=https://drive.usercontent.google.com/download?id=1zF1TbPHoSBVTRzjPVX7ktmwWb6rAUVM4&export=download&confirm=t
libmpvMirrorUrl=

# The version this build is. The About screen, the update check, the logs, the installers and the Android version name
# all read it. CI overrides it with -PpearVersion (the git tag, or PEAR_DEFAULT_VERSION on a manual desktop run).
pearVersion=0.0.3-Alpha

# The GitHub repo the app checks for new versions: it reads https://github.com/<updateRepo>/releases/latest/download/latest.json.
# Change it here (owner/name) if the project moves; the next build uses the new value.
updateRepo=azizfedhil/media-beta

# Android (batch 2): AndroidX is used by activity-compose and the app module.
android.useAndroidX=true
