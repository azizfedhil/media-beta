name: Cloud

# Deploys the pear-cloud Worker in cloud/. A push to main that touches cloud/ applies the D1 migrations and deploys.
# Pushes to other branches only check that the Worker bundles. Nothing touches the live database off main.
on:
  workflow_dispatch:
  push:
    paths:
      - "cloud/**"
      - ".github/workflows/cloud.yml"

permissions:
  contents: read

concurrency:
  group: cloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check the Worker bundles (branches other than main)
        if: github.ref != 'refs/heads/main'
        run: npx wrangler deploy --dry-run

      - name: Apply D1 migrations (main only)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler d1 migrations apply pear-pair --remote

      - name: Deploy (main only)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy
