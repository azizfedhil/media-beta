name: Desktop CI
# Manual only: Actions tab -> "Desktop CI" -> Run workflow.
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Force bash for all multi-line `run` steps; on Windows the default shell is
    # PowerShell, which can't parse POSIX `if [ ... ]; then ... fi` syntax.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Fetch libmpv for packaging (GPL build, see desktopApp/packaging/resources/README.md)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sSL -o "$RUNNER_TEMP/mpv-dev.7z" \
              https://github.com/shinchiro/mpv-winbuild-cmake/releases/latest/download/mpv-dev-x86_64-v3.7z
            # `7z` is not on the bash PATH on Windows runners; use the bundled 7-Zip binary instead.
            "/c/Program Files/7-Zip/7z.exe" x -y \
              -o"$GITHUB_WORKSPACE/desktopApp/packaging/resources/windows-x64" \
              "$RUNNER_TEMP/mpv-dev.7z" libmpv-2.dll
          else
            sudo apt-get update && sudo apt-get install -y libmpv2
            cp /usr/lib/x86_64-linux-gnu/libmpv.so.2 "$GITHUB_WORKSPACE/desktopApp/packaging/resources/linux-x64/" || \
              cp "$(ldconfig -p | awk '/libmpv\.so\.2 /{print $NF; exit}')" \
                 "$GITHUB_WORKSPACE/desktopApp/packaging/resources/linux-x64/"
          fi
      - name: Build, test, package
        # If the fetch above couldn't place the library, still compile/test and produce a distributable,
        # skipping only the bundling check (-Ppear.skipLibmpv).
        run: |
          gradle :shared:build :desktopApp:createDistributable --console=plain || {
            echo "::warning::libmpv not available in CI; building without the bundled library (-Ppear.skipLibmpv)"
            gradle :shared:build :desktopApp:createDistributable --console=plain -Ppear.skipLibmpv=true
          }
      - name: Smoke test (opens the window for 3 s under Xvfb)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          SKIKO_RENDER_API: SOFTWARE_FAST
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libxrender1 libxtst6 libxi6 libfontconfig1
          xvfb-run -a gradle :desktopApp:run --args="--smoke" --console=plain
      - name: Generate Gradle wrapper (commit these files once)
        if: runner.os == 'Linux'
        run: gradle wrapper --gradle-version 9.5.1 --console=plain
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/*
      - uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-${{ runner.os }}
          path: desktopApp/build/compose/binaries/main/app/
