name: Desktop CI
# Runs from the Actions tab (Desktop CI -> Run workflow), and on a tag such as desktop-v0.0.1-Alpha. A tag also publishes a
# GitHub Release with the Windows installer, the Linux RPM and latest.json.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

env:
  # The version of a manual run. A tag sets its own: desktop-v0.0.1-Alpha builds 0.0.1-Alpha.
  PEAR_DEFAULT_VERSION: 0.0.1-Alpha

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # The oldest Ubuntu runner. glibc is backward compatible, so a p2p_core.so built here runs on newer distros too.
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        # PowerShell is the default on Windows and can't parse POSIX `if [ ... ]; then ... fi`.
        shell: bash
    env:
      # Empty secrets mean an unsigned build (see docs/desktop/code-signing.md).
      WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Version
        run: |
          ver="$PEAR_DEFAULT_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then ver="${GITHUB_REF_NAME#desktop-v}"; fi
          echo "PEAR_VERSION=$ver" >> "$GITHUB_ENV"
          echo "Building Pear $ver"

      # The tests and the smoke test need a libmpv on the runner. None of it goes into the packages: Windows gets libmpv from
      # the installer, and the Linux RPM requires the distribution's mpv-libs.
      - name: libmpv for tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2 || sudo apt-get install -y libmpv1

      # Linux packaging: jpackage builds the RPM with rpmbuild, which the "rpm" package provides.
      - name: RPM tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y rpm

      # The P2P engine (p2p-core, Rust). The Gradle build compiles it into a shared library and generates its
      # Kotlin bindings, so cargo must be on the PATH before the build step.
      - uses: dtolnay/rust-toolchain@stable

      # Keeps the cargo registry and p2p-core's target folder between runs. Without it every run downloads and compiles
      # all of the crates again, because each runner starts from a clean checkout. The key follows Cargo.lock when it is committed.
      - uses: Swatinem/rust-cache@v2
        with:
          # p2p-core, and uniffi-bindgen, which is its own workspace with its own target folder.
          workspaces: |
            p2p-core
            p2p-core/uniffi-bindgen

      # No fallback: a failed build fails the job here.
      - name: Build, test, package
        run: |
          tasks=(":shared:build" ":desktopApp:createDistributable")
          if [ "$RUNNER_OS" = "Linux" ]; then tasks+=(":desktopApp:packageRpm"); fi
          gradle "${tasks[@]}" "-PpearVersion=$PEAR_VERSION" --console=plain

      # jpackage is asked for the requirement in desktopApp/build.gradle.kts. If the RPM still lacks it, build the RPM again here
      # with the JDK's own jpackage, from the app image Gradle made, and pass the requirement directly.
      - name: Rebuild the RPM with the libmpv requirement if it is missing (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          rpmdir=desktopApp/build/compose/binaries/main/rpm
          rpmfile="$(ls "$rpmdir"/*.rpm | head -n1)"
          if rpm -qpR "$rpmfile" | grep -q 'libmpv\.so\.2'; then
            echo "The RPM already requires libmpv"
            exit 0
          fi
          echo "The RPM does not require libmpv; building it again with jpackage"
          image="$(find desktopApp/build/compose/binaries/main/app -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$image"
          numeric="${PEAR_VERSION%%-*}"
          out="$(mktemp -d)"
          "$JAVA_HOME/bin/jpackage" --type rpm --app-image "$image" --dest "$out" \
            --name pear --app-version "$numeric" \
            --linux-package-name pear --linux-app-category AudioVideo --linux-menu-group Video \
            --linux-package-deps 'libmpv.so.2()(64bit)'
          new="$(ls "$out"/*.rpm | head -n1)"
          test -n "$new"
          rm -f "$rpmdir"/*.rpm
          cp "$new" "$rpmdir"/

      # libmpv is loaded with dlopen, so rpmbuild cannot detect it: the RPM must declare it, or it installs without it.
      - name: Check the RPM requires libmpv (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          rpm="$(ls desktopApp/build/compose/binaries/main/rpm/*.rpm | head -n1)"
          rpm -qpR "$rpm"
          rpm -qpR "$rpm" | grep -q 'libmpv\.so\.2' || { echo "RPM does not require libmpv" >&2; exit 1; }

      # The build has downloaded libmpv and recorded its hash. The installer uses the same link, mirror and hash.
      - name: Read the libmpv link and hash (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          url="$(grep '^libmpvUrl=' gradle.properties | cut -d= -f2-)"
          mirror="$(grep '^libmpvMirrorUrl=' gradle.properties | cut -d= -f2- || true)"
          sha="$(cat shared/build/libmpv/sha256.txt)"
          test -n "$url" && test -n "$sha"
          echo "LIBMPV_URL=$url" >> "$GITHUB_ENV"
          echo "LIBMPV_MIRROR_URL=$mirror" >> "$GITHUB_ENV"
          echo "LIBMPV_SHA256=$sha" >> "$GITHUB_ENV"
          echo "libmpv SHA-256 (from the build): $sha"

      - name: Check p2p_core.dll does not need the VC++ runtime (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          lib=desktopApp/packaging/resources/windows-x64/p2p_core.dll
          imports="$(python tools/inspect_binary.py "$lib" --imports)"
          echo "$imports"
          # Fail if the import list is missing, not only if it names the runtime: a check that reads nothing must not pass.
          if ! echo "$imports" | grep -q '^imports: '; then echo "no import list was read from $lib" >&2; exit 1; fi
          if echo "$imports" | grep -Eqi 'VCRUNTIME140|MSVCP140'; then
            echo "p2p_core.dll still imports the Visual C++ runtime; check .cargo/config.toml" >&2
            exit 1
          fi

      - name: Smoke test (opens the window for 3 s under Xvfb)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          SKIKO_RENDER_API: SOFTWARE_FAST
        run: |
          sudo apt-get install -y xvfb libgl1 libxrender1 libxtst6 libxi6 libfontconfig1
          xvfb-run -a gradle :desktopApp:run --args="--smoke" --console=plain

      # Signs the app's exe and DLLs when the signing secret is set. Otherwise the build stays unsigned.
      - name: Sign the app files (Windows, when a certificate is set)
        if: runner.os == 'Windows' && env.WINDOWS_SIGN_PFX_BASE64 != ''
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: bash tools/sign_windows.sh desktopApp/build/compose/binaries/main/app/Pear

      - name: Build PearSetup.exe (Windows)
        if: runner.os == 'Windows'
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          set -euo pipefail
          choco install innosetup --no-progress --yes
          iscc=""
          for candidate in "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/c/Program Files/Inno Setup 6/ISCC.exe"; do
            if [ -f "$candidate" ]; then iscc="$candidate"; break; fi
          done
          if [ -z "$iscc" ]; then echo "ISCC.exe not found after installing Inno Setup" >&2; exit 1; fi
          numeric="${PEAR_VERSION%%-*}"
          "$iscc" "/DPearVersion=$PEAR_VERSION" "/DPearNumericVersion=$numeric.0" \
            "/DLibmpvUrl=$LIBMPV_URL" "/DLibmpvMirrorUrl=$LIBMPV_MIRROR_URL" "/DLibmpvSha256=$LIBMPV_SHA256" \
            desktopApp/installer/pear.iss

      - name: Sign PearSetup.exe (Windows, when a certificate is set)
        if: runner.os == 'Windows' && env.WINDOWS_SIGN_PFX_BASE64 != ''
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: bash tools/sign_windows.sh desktopApp/build/installer/PearSetup.exe

      - name: Generate Gradle wrapper (commit these files once)
        if: runner.os == 'Linux'
        run: gradle wrapper --gradle-version 9.5.1 --console=plain

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/*

      - uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-${{ runner.os }}
          path: desktopApp/build/compose/binaries/main/app/

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: PearSetup-windows
          path: desktopApp/build/installer/PearSetup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: pear-rpm
          path: desktopApp/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

  # Runs only for a desktop-v* tag: writes latest.json and publishes the release with the installers.
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: PearSetup-windows
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: pear-rpm
          path: dist

      - name: Write latest.json and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#desktop-v}"
          python tools/make_latest_json.py \
            --version "$version" --tag "$tag" --repo "$GITHUB_REPOSITORY" \
            --windows dist/PearSetup.exe --linux dist/pear-*.rpm \
            --out dist/latest.json
          # Not a pre-release, and marked Latest: the app reads .../releases/latest/download/latest.json, and GitHub skips
          # pre-releases for that URL. "Alpha" is in the version string, not in the release flag.
          gh release create "$tag" --title "Pear $version" --latest \
            --notes "Pear $version. Windows: run PearSetup.exe. Linux: sudo dnf install ./pear-*.rpm." \
            dist/PearSetup.exe dist/pear-*.rpm dist/latest.json
