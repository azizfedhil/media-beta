name: Cloud setup (run once)

# Manual only: Actions -> "Cloud setup (run once)" -> Run workflow.
# Creates the pear-pair D1 database if it does not exist, then prints the list. Copy the database_id of pear-pair
# into cloud/wrangler.jsonc (replacing REPLACE_WITH_D1_DATABASE_ID) and commit it. Running it again is safe.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create pear-pair if it does not exist
        run: |
          if npx wrangler d1 list | grep -q "pear-pair"; then
            echo "pear-pair already exists. Nothing to create."
          else
            npx wrangler d1 create pear-pair
          fi

      - name: Print the database list (copy the database_id of pear-pair)
        run: npx wrangler d1 list
